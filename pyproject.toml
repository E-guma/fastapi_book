[project]
name = "fastapi_book"
version = "0.1.0"
description = "Cryptid API from the FastAPI book"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.161.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["chpt_8/src/tests"]
pythonpath = ["chpt_8/src"]
