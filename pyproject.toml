[project]
name = "fastapi_book"
version = "0.1.0"
description = "Cryptid API from the FastAPI book"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.161.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["chpt_8/src/tests"]
pythonpath = ["chpt_8/src"]
